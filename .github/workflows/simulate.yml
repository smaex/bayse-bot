name: Strategy Simulation

on:
  workflow_dispatch: # Only runs when you click "Run workflow" in GitHub Actions UI

jobs:
  simulate:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt pytest

    - name: Test simulation model
      run: python -m pytest -q tests/test_simulation.py

    - name: Run audited-economics simulation
      run: >-
        python tools/simulate_economics.py --paths 1000 --days 30 --stake 100
        --output "$RUNNER_TEMP/monte_carlo_simulation.md"

    - name: Upload simulation report
      uses: actions/upload-artifact@v4
      with:
        name: monte-carlo-simulation
        path: ${{ runner.temp }}/monte_carlo_simulation.md
        if-no-files-found: error
        retention-days: 14
