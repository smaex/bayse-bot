name: Bot watchdog (self-heal + outage alert)

# The failure this prevents is specific and it has happened: a deploy or a crash
# left the process stopped, nothing restarted it, and the account went two days
# without a trade while every log line still looked normal. A trading bot that
# cannot be observed is not "conservative", it is blind.
#
# Every 15 minutes:
#   * probe /live and /ready (public HTTP when the APP_URL repo variable is set,
#     over SSH when the VPS secrets are set)
#   * if the process is dead or wedged, restart the unit and re-probe
#   * alert on Telegram only when something was actually wrong
#
# It never touches orders, settings, risk limits, or the paused flag: recovery is
# limited to bringing the *same* code back up. Missing configuration degrades to a
# warning instead of a failing run, because a watchdog that cries every 15 minutes
# is the exact alert-fatigue that let a multi-day stall go unnoticed.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

concurrency:
  group: bot-watchdog
  cancel-in-progress: false

jobs:
  probe:
    name: Probe and self-heal
    runs-on: ubuntu-latest
    env:
      # Exposed as env (not secrets) so step-level `if` can check whether this
      # deployment is configured for SSH at all.
      VPS_HOST: ${{ secrets.VPS_HOST }}
      NOTIFY_CHAT: ${{ secrets.TELEGRAM_NOTIFY_CHAT_ID }}
    steps:
      - name: Note unconfigured deployment
        if: ${{ env.VPS_HOST == '' && vars.APP_URL == '' }}
        run: |
          echo "::warning::Watchdog is not configured: set the VPS_HOST/VPS_USER/VPS_SSH_KEY secrets or the APP_URL repo variable. No liveness check ran."

      - name: HTTP probe (APP_URL)
        id: http
        if: ${{ vars.APP_URL != '' }}
        run: |
          base="${{ vars.APP_URL }}"
          base="${base%/}"
          live=$(curl -fsS --max-time 10 "$base/live" 2>/dev/null || echo "")
          ready=$(curl -fsS --max-time 10 "$base/ready" 2>/dev/null || echo "")
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          if [ -z "$live" ]; then
            echo "::warning::/live did not answer on $base"
            exit 1
          fi
          echo "✅ /live answered; /ready: ${ready:-<no response>}"

      - name: Verify the service is running (SSH)
        if: ${{ env.VPS_HOST != '' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key:      ${{ secrets.VPS_SSH_KEY }}
          port:     ${{ secrets.VPS_PORT || '22' }}
          timeout:  30
          # The restart-and-reprobe loop below can take ~2.5 minutes; the
          # 60s default would abort the recovery before it can finish.
          command_timeout: 300
          script_stop: false
          script: |
            # POSIX-safe flags only: this snippet runs under the remote
            # user's login shell, which is not guaranteed to be bash
            # (`pipefail` would abort a dash shell instantly).
            set -u
            SERVICE="${SERVICE:-bayse-bot}"
            PORT="${PORT:-8080}"
            READY_URL="http://127.0.0.1:${PORT}/ready"
            LIVE_URL="http://127.0.0.1:${PORT}/live"

            sc() {
              # Prefer the verbs the deploy user's sudoers allows (restart,
              # status, is-active); fall back to a plain call when running as root.
              if [ "$(id -u)" = "0" ]; then systemctl "$@"
              else sudo -n systemctl "$@" 2>/dev/null || systemctl "$@"; fi
            }
            state="$(sc is-active "$SERVICE" 2>/dev/null || echo unknown)"
            live="$(curl -fsS --max-time 8 "$LIVE_URL" 2>/dev/null || echo '')"
            ready="$(curl -fsS --max-time 8 "$READY_URL" 2>/dev/null || echo '')"
            echo "unit=$state live=${live:-none} ready=${ready:-none}"

            if [ -n "$ready" ]; then
              echo "✅ healthy: $ready"
              exit 0
            fi

            echo "::warning::/ready unavailable (unit=$state) — restarting $SERVICE"
            # Recent failures matter more than uptime: show them before the fix.
            journalctl -u "$SERVICE" -n 25 --no-pager 2>/dev/null | tail -25 \
              || sudo -n journalctl -u "$SERVICE" -n 25 --no-pager 2>/dev/null | tail -25 || true
            sc restart "$SERVICE" >/dev/null 2>&1 || sc start "$SERVICE" >/dev/null 2>&1 || true

            for i in $(seq 1 20); do
              sleep 6
              ready="$(curl -fsS --max-time 8 "$READY_URL" 2>/dev/null || echo '')"
              if [ -n "$ready" ]; then
                echo "✅ recovered after restart: $ready"
                exit 0
              fi
            done
            echo "::error::service still not ready after restart"
            exit 1

      - name: Alert on failure
        if: ${{ failure() && env.NOTIFY_CHAT != '' }}
        uses: appleboy/telegram-action@master
        with:
          to:      ${{ secrets.TELEGRAM_NOTIFY_CHAT_ID }}
          token:   ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            🚨 *Bayse bot watchdog*
            `/ready` did not answer and a restart did not recover it.
            Run: `sudo systemctl status bayse-bot` and
            `sudo journalctl -u bayse-bot -n 200` on the VPS.
            Positions stay open on the exchange — if you cannot restore the bot,
            check the Bayse portfolio and close/hedge manually if needed.
            (Trading itself reports *why* it is quiet via /why; this alert is
            about the process being unreachable.)
