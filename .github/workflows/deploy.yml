name: Deploy to VPS

# A deploy must never be able to leave the bot down. Two guards enforce that:
#   1. `verify` runs the regression suite and a config/import sanity check, so
#      code that cannot start never reaches the server at all.
#   2. `deploy` shells out to scripts/zero_downtime_deploy.sh, which verifies
#      /live and /ready and — on any failure — rolls the checkout back to the
#      previously running commit and restarts before reporting anything.

on:
  push:
    branches: [main, master]
  workflow_dispatch: {}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Tests and config sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Regression suite
        run: python -m pytest -q

      - name: Config and import sanity
        env:
          TELEGRAM_TOKEN: "123456:sanity-check-token"
          ENCRYPTION_KEY: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
          DATABASE_URL: "postgresql://sanity:sanity@127.0.0.1:5432/sanity"
        run: |
          python - <<'PY'
          import config
          import bot            # import-time wiring only: no DB, no orders
          import executor
          import strategies
          print("imports ok; live_trading =", config.LIVE_TRADING)
          print("permitted strategies   =", config.PERMITTED_STRATEGIES)
          PY

  deploy:
    name: Deploy & restart bot
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Fail fast and self-explanatory when the host is not configured. Every
      # historical deploy failure of this repo aborted inside the SSH step
      # with no context; this makes "missing secrets" impossible to confuse
      # with "host unreachable" or "remote script failed".
      - name: Check deploy configuration
        env:
          VPS_HOST:     ${{ secrets.VPS_HOST }}
          VPS_USER:     ${{ secrets.VPS_USER }}
          VPS_SSH_KEY:  ${{ secrets.VPS_SSH_KEY }}
          VPS_PORT_SET: ${{ secrets.VPS_PORT != '' }}
        run: |
          missing=""
          [ -n "$VPS_HOST" ]    || missing="$missing VPS_HOST"
          [ -n "$VPS_USER" ]    || missing="$missing VPS_USER"
          [ -n "$VPS_SSH_KEY" ] || missing="$missing VPS_SSH_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Deploy is not configured — missing repository secrets:$missing"
            echo "Add them under Settings → Secrets and variables → Actions."
            echo "VPS_PORT is optional (defaults to 22); currently set: ${VPS_PORT_SET:-false}"
            exit 1
          fi
          echo "Deploy configuration present (host/user/key set; port set: ${VPS_PORT_SET:-false})."

      # appleboy/ssh-action v1 has no `files:` input — the previous workflow
      # passed one, it was ignored with a warning, and the deploy step then
      # failed on a host that never received the script. Instead the script is
      # base64-encoded here and written on the remote over the command
      # channel itself, which cannot be dropped by env-forwarding or scp.
      - name: Encode deploy script
        id: prep
        run: |
          {
            echo 'b64<<BAYSE_DEPLOY_B64_EOF'
            base64 -w0 scripts/zero_downtime_deploy.sh
            echo
            echo 'BAYSE_DEPLOY_B64_EOF'
          } >> "$GITHUB_OUTPUT"
          echo "Deploy script encoded: $(wc -c < scripts/zero_downtime_deploy.sh) bytes"

      # Native ssh instead of appleboy/ssh-action: every historical failure of
      # this pipeline died inside that action's black box, and its error text
      # is only reachable through run logs. With plain ssh we control the
      # flags, pre-flight each layer (DNS → TCP → SSH), and surface the exact
      # failure in both the run annotations and the Telegram notice.
      - name: Deploy & restart bot
        id: ssh_deploy
        timeout-minutes: 15
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          DEPLOY_SCRIPT_B64: ${{ steps.prep.outputs.b64 }}
        run: |
          PORT="${VPS_PORT:-22}"
          KEY="$RUNNER_TEMP/bayse_deploy_key"
          LOG="$RUNNER_TEMP/ssh_deploy.log"
          umask 077
          # tr -d '\r' forgives a key pasted on Windows; printf appends the
          # final newline that pastes often drop — both would break the PEM.
          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > "$KEY"
          chmod 600 "$KEY"
          # -v: when SSH fails, the verbose handshake/auth log lines are what
          # actually say why; they land in $LOG and in the annotations.
          # IdentitiesOnly: offer only the key from the secret, never agent keys.
          SSH_OPTS=(-v -i "$KEY" -p "$PORT" -o StrictHostKeyChecking=accept-new
                    -o IdentitiesOnly=yes
                    -o ConnectTimeout=20 -o ServerAliveInterval=15 -o BatchMode=yes)

          diagnose() {  # $1 = summary line; goes to annotations AND Telegram
            echo "::error::$1"
            if [ -f "$LOG" ]; then
              # Raw tail, unfiltered: the previous run's grep was too narrow
              # (and case-sensitive) and hid the decisive lines. These
              # annotations are readable from the run summary API, so they are
              # the failure's own words rather than a guess about them.
              tail -20 "$LOG" | while IFS= read -r line; do
                echo "::error::ssh-output: $line"
              done
            fi
            {
              echo 'ssh_diag<<BAYSE_DIAG_EOF'
              echo "$1"
              if [ -f "$LOG" ]; then echo "---- last output ----"; tail -30 "$LOG"; fi
              echo 'BAYSE_DIAG_EOF'
            } >> "$GITHUB_OUTPUT"
          }

          echo "── pre-flight: DNS for $VPS_HOST ──"
          if ! getent hosts "$VPS_HOST"; then
            diagnose "VPS_HOST '$VPS_HOST' does not resolve (DNS). Check the secret's value (Settings → Secrets → VPS_HOST)."
            exit 1
          fi

          echo "── pre-flight: TCP $VPS_HOST:$PORT ──"
          if ! timeout 15 bash -c "exec 3<>/dev/tcp/$VPS_HOST/$PORT" 2>/dev/null; then
            diagnose "TCP connect to $VPS_HOST:$PORT failed — VPS down, wrong port, or its firewall rejecting GitHub runners. Verify: ssh -p $PORT $VPS_USER@$VPS_HOST from another machine."
            exit 1
          fi
          echo "TCP connect OK."

          echo "── deploying over SSH ──"
          set +e
          {
            echo "cat > \"\$HOME/.bayse_deploy.b64\" <<'BAYSE_DEPLOY_B64_EOF'"
            echo "$DEPLOY_SCRIPT_B64"
            echo "BAYSE_DEPLOY_B64_EOF"
            echo 'if ! base64 -d "$HOME/.bayse_deploy.b64" > "$HOME/zero_downtime_deploy.sh"; then'
            echo '  echo "ERROR: could not decode the deploy script on the host"; exit 1; fi'
            echo 'rm -f "$HOME/.bayse_deploy.b64"'
            echo "export BRANCH=\"${{ github.ref_name }}\""
            echo 'bash "$HOME/zero_downtime_deploy.sh"'
            echo 'rc=$?; echo "zero_downtime_deploy.sh finished with exit code $rc"; exit $rc'
          } | ssh "${SSH_OPTS[@]}" "$VPS_USER@$VPS_HOST" 'bash -s' 2>&1 | tee "$LOG"
          rc=${PIPESTATUS[1]}
          set -e
          if [ "$rc" -ne 0 ]; then
            diagnose "SSH deploy failed (exit $rc). If the error mentions authentication, the VPS_SSH_KEY/VPS_USER secrets do not match the host; if it mentions host key verification, the VPS was reinstalled (remove the old known_hosts entry)."
            exit "$rc"
          fi

      - name: Notify Telegram on success
        if: success()
        uses: appleboy/telegram-action@master
        with:
          to:      ${{ secrets.TELEGRAM_NOTIFY_CHAT_ID }}
          token:   ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            ✅ *Bayse Bot deployed*
            Branch: `${{ github.ref_name }}`
            Commit: `${{ github.event.head_commit.message }}`
            By: ${{ github.actor }}
            `/ready` verified after start.

      - name: Notify Telegram on failure
        if: failure()
        uses: appleboy/telegram-action@master
        with:
          to:    ${{ secrets.TELEGRAM_NOTIFY_CHAT_ID }}
          token:   ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            ❌ *Bayse Bot deploy FAILED*
            Branch: `${{ github.ref_name }}`

            ${{ steps.ssh_deploy.outputs.ssh_diag || 'The failure happened before the SSH step.' }}

            If the deploy script reached the host, it rolls back and restarts the
            previous commit before reporting failure. Check the bot anyway:
            `ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} sudo systemctl status bayse-bot`
            Full log: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
