name: Deploy to VPS

# A deploy must never be able to leave the bot down. Two guards enforce that:
#   1. `verify` runs the regression suite and a config/import sanity check, so
#      code that cannot start never reaches the server at all.
#   2. `deploy` shells out to scripts/zero_downtime_deploy.sh, which verifies
#      /live and /ready and — on any failure — rolls the checkout back to the
#      previously running commit and restarts before reporting anything.

on:
  push:
    branches: [main, master]
  workflow_dispatch: {}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Tests and config sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Regression suite
        run: python -m pytest -q

      - name: Config and import sanity
        env:
          TELEGRAM_TOKEN: "123456:sanity-check-token"
          ENCRYPTION_KEY: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
          DATABASE_URL: "postgresql://sanity:sanity@127.0.0.1:5432/sanity"
        run: |
          python - <<'PY'
          import config
          import bot            # import-time wiring only: no DB, no orders
          import executor
          import strategies
          print("imports ok; live_trading =", config.LIVE_TRADING)
          print("permitted strategies   =", config.PERMITTED_STRATEGIES)
          PY

  deploy:
    name: Deploy & restart bot
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy & restart bot
        uses: appleboy/ssh-action@v1.0.3
        env:
          # Forwarded into the remote script by `envs` below.
          BRANCH: ${{ github.ref_name }}
        with:
          host:     ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key:      ${{ secrets.VPS_SSH_KEY }}
          port:     ${{ secrets.VPS_PORT }}
          # Copied to the remote home directory first, so the deploy does not
          # depend on the code that is currently checked out on the server.
          files: scripts/zero_downtime_deploy.sh
          script_stop: false
          envs: BRANCH
          script: |
            set -uo pipefail
            if [ -f ./zero_downtime_deploy.sh ]; then
              bash ./zero_downtime_deploy.sh
            else
              echo "WARN: copied script missing; falling back to the checkout's copy"
              bash /opt/bayse-bot/scripts/zero_downtime_deploy.sh
            fi

      - name: Notify Telegram on success
        if: success()
        uses: appleboy/telegram-action@master
        with:
          to:      ${{ secrets.TELEGRAM_NOTIFY_CHAT_ID }}
          token:   ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            ✅ *Bayse Bot deployed*
            Branch: `${{ github.ref_name }}`
            Commit: `${{ github.event.head_commit.message }}`
            By: ${{ github.actor }}
            `/ready` verified after start.

      - name: Notify Telegram on failure
        if: failure()
        uses: appleboy/telegram-action@master
        with:
          to:    ${{ secrets.TELEGRAM_NOTIFY_CHAT_ID }}
          token:   ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            ❌ *Bayse Bot deploy FAILED*
            Branch: `${{ github.ref_name }}`
            Commit: `${{ github.event.head_commit.message }}`

            The deploy script rolls back and restarts the previous commit before
            reporting failure. Check the bot is running anyway:
            `ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} sudo systemctl status bayse-bot`
            and read the Actions log for the exact step.
